name: Deploy Docs

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen --no-default-groups --group docs --python 3.11

      - name: Validate documentation structure
        run: |
          if [ ! -f docs/index.rst ]; then echo "index.rst not found!"; exit 1; fi

      - name: Build documentation
        run: uv run --frozen --no-default-groups --group docs sphinx-build -b html docs/ docs/_build/html

      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html
